services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: peopleops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: peopleops
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: peopleops

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peopleops -d peopleops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: